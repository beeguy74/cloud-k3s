---
- name: Bootstrap K3s Cluster and Deploy Hello World
  hosts: masters
  become: yes # Выполнять команды через sudo внутри виртуалки
  tasks:

    # --- 1. Установка Kubernetes (K3s) ---
    - name: Download and install K3s (Single Node)
      shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s # Пропускать таску, если K3s уже установлен (идемпотентность)
      environment:
        # Привязываем API-сервер и Ingress к нашему IP
        INSTALL_K3S_EXEC: "server --node-ip 192.168.56.10 --bind-address 192.168.56.10"

    - name: Wait for K3s node to be ready
      shell: k3s kubectl get nodes | grep " Ready"
      register: node_ready
      until: node_ready.rc == 0
      retries: 10
      delay: 5

    # --- 2. Деплой Hello World приложения (nginx) ---
    - name: Create Hello World Deployment
      shell: |
        k3s kubectl create deployment hello-world --image=nginx:alpine --port=80
      args:
        creates: /var/lib/rancher/k3s/hello-world-deployment.created # Хак для идемпотентности
    
    - name: Mark Deployment as created (Idempotency tag)
      file:
        path: /var/lib/rancher/k3s/hello-world-deployment.created
        state: touch

    # --- 3. Создание Service для приложения ---
    - name: Expose Hello World as a ClusterIP Service
      shell: |
        k3s kubectl expose deployment hello-world --port=80
      ignore_errors: yes # Игнорируем ошибку, если сервис уже существует

    # --- 4. Настройка Traefik Ingress для доступа снаружи ---
    - name: Create Ingress routing (Traefik) for Hello World
      copy:
        dest: /tmp/hello-world-ingress.yaml
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: hello-world-ingress
            annotations:
              kubernetes.io/ingress.class: "traefik"
          spec:
            rules:
            - host: hello.42.local
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: hello-world
                      port:
                        number: 80

    - name: Apply Ingress manifest
      shell: k3s kubectl apply -f /tmp/hello-world-ingress.yaml

